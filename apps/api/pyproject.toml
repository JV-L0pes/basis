[project]
name = "basis-api"
version = "0.1.0"
description = "Basis API — investment management platform for the Brazilian financial market"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "psycopg[binary,pool]>=3.2.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "import-linter>=2.2",
    "mypy>=1.14",
    "pip-audit>=2.7",
    "polyfactory>=2.20",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basis"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a running PostgreSQL (BASIS_TEST_DATABASE_URL)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # psycopg async connections garbage-collected after the TestClient portal
    # closes are an artefact of the test harness, not of the application.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/basis"]
branch = true
omit = ["src/basis/scripts/*", "src/basis/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
show_missing = true

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
warn_return_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "BLE", "C4", "C90", "COM", "DTZ", "E", "ERA", "EXE",
    "F", "FBT", "FAST", "FIX", "FLY", "G", "I", "ICN", "INP", "ISC", "LOG", "N",
    "NPY", "PD", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "Q", "RET", "RSE",
    "RUF", "S", "SIM", "SLF", "SLOT", "T10", "TC", "TD", "TID", "TRY", "UP", "W",
]
ignore = [
    "E501",    # line length is the formatter's job
    "TRY003",  # long messages outside the exception class are fine for domain errors
    "EM101",   # allow string literals in raise
    "EM102",   # allow f-strings in raise
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "PLR0913", # use cases legitimately take several collaborators
    "PLR2004", # magic values are common in finance thresholds
    "TC001",   # FastAPI resolves annotations at runtime; moving imports breaks it
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["basis"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now" = { msg = "Inject a Clock and use clock.now() instead." }
"datetime.datetime.utcnow" = { msg = "Use an injected Clock (utcnow is deprecated)." }

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN", "ARG001", "ARG002", "DTZ001", "DTZ011", "PLC0415", "PLR2004", "PT011",
    "S101", "S105", "S106", "S311", "SLF001", "TID251", "TRY301",
]
"**/presentation/router.py" = ["ARG001"]  # auth guards are injected for their side effect
"alembic/**" = ["ANN", "INP001", "PTH", "TID251", "I001", "ERA001", "S", "D"]
"src/basis/scripts/**" = ["T201", "ANN"]
"src/basis/kernel/domain/clock.py" = ["TID251"]

# ---------------------------------------------------------------------------
# Import Linter — architecture boundaries (see ARCHITECTURE.md)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["basis"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Kernel layering"
type = "layers"
layers = [
    "basis.kernel.infrastructure",
    "basis.kernel.application",
    "basis.kernel.domain",
]

[[tool.importlinter.contracts]]
name = "Bounded contexts have independent domains"
type = "independence"
modules = [
    "basis.modules.identity.domain",
    "basis.modules.clients.domain",
    "basis.modules.portfolio.domain",
    "basis.modules.market_data.domain",
    "basis.modules.analytics.domain",
]

[[tool.importlinter.contracts]]
name = "Domain layers stay pure (no frameworks)"
type = "forbidden"
source_modules = [
    "basis.kernel.domain",
    "basis.modules.identity.domain",
    "basis.modules.clients.domain",
    "basis.modules.portfolio.domain",
    "basis.modules.market_data.domain",
    "basis.modules.analytics.domain",
]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "structlog",
    "basis.kernel.infrastructure",
    "basis.modules.identity.infrastructure",
    "basis.modules.clients.infrastructure",
    "basis.modules.portfolio.infrastructure",
    "basis.modules.market_data.infrastructure",
    "basis.modules.analytics.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Identity layering"
type = "layers"
layers = [
    "basis.modules.identity.presentation",
    "basis.modules.identity.application",
    "basis.modules.identity.domain",
]

[[tool.importlinter.contracts]]
name = "Clients layering"
type = "layers"
layers = [
    "basis.modules.clients.presentation",
    "basis.modules.clients.application",
    "basis.modules.clients.domain",
]

[[tool.importlinter.contracts]]
name = "Portfolio layering"
type = "layers"
layers = [
    "basis.modules.portfolio.presentation",
    "basis.modules.portfolio.application",
    "basis.modules.portfolio.domain",
]

[[tool.importlinter.contracts]]
name = "Market data layering"
type = "layers"
layers = [
    "basis.modules.market_data.presentation",
    "basis.modules.market_data.application",
    "basis.modules.market_data.domain",
]

[[tool.importlinter.contracts]]
name = "Analytics layering"
type = "layers"
layers = [
    "basis.modules.analytics.presentation",
    "basis.modules.analytics.application",
    "basis.modules.analytics.domain",
]
