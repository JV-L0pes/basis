name: basis

services:
  db:
    image: postgres:16-alpine
    container_name: basis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: basis
      POSTGRES_PASSWORD: basis
      POSTGRES_DB: basis
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${BASIS_DB_PORT:-5432}:5432"
    volumes:
      - basis_pgdata:/var/lib/postgresql/data
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basis -d basis"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - basis

  api:
    profiles: ["full"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: basis_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BASIS_ENVIRONMENT: production
      BASIS_DATABASE_URL: postgresql+psycopg://basis:basis@db:5432/basis
      BASIS_CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - basis

  web:
    profiles: ["full"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: basis_web
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - basis

volumes:
  basis_pgdata:
    name: basis_pgdata

networks:
  basis:
    name: basis_network
    driver: bridge
